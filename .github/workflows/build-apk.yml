name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# a newer push replaces a build that is still running
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Check (tests, types, lint)
        run: |
          npm test
          npx tsc --noEmit
          npx expo lint

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Signing certificate (SHA-1 for the Google Cloud Android OAuth client)
        run: keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1|SHA256'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk HisabKhata-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HisabKhata-android
          path: HisabKhata-Android.apk

      - name: Publish as a GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: হিসাব খাতা 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Android অ্যাপ: নিচের **HisabKhata-Android.apk** নামিয়ে ইনস্টল করুন।
            আগের ভার্সনের উপরে ইনস্টল করলে হিসাব মুছবে না।

            সবসময় সর্বশেষ ভার্সন: https://github.com/${{ github.repository }}/releases/latest/download/HisabKhata-Android.apk
          files: HisabKhata-Android.apk
